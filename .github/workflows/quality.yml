name: Quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/portfolio-refonte]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Unit tests
        run: bunx vitest run
      - name: Type check
        run: bunx tsc --noEmit
      - name: Production build
        run: bun run build
